[project]
name = "audioconvert"
version = "1.0.0"
description = "WAV/AIFF/FLAC to MP3/M4A converter with loudness normalization, metadata, and cover art"
authors = [
    {name = "Holger Kampffmeyer", email = "holger.kampffmeyer+dj@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
audioconvert = "src.convert:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
